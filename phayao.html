<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Phayao | Northern Thailand</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    transition:0.4s;
    background:#f4f4f4;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#111;
    color:white;
    position:fixed;
    width:100%;
    z-index:1000;
}

nav button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#444;
    color:white;
}

.hero{
    height:100vh;
    background:url("https://upload.wikimedia.org/wikipedia/commons/7/70/Kwan_Phayao.jpg") no-repeat center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-shadow:0 0 15px black;
}

.hero h1{
    font-size:60px;
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:100px 20px 50px;
}

.section{
    margin-bottom:60px;
}

.section img{
    width:100%;
    border-radius:15px;
    margin:20px 0;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.reveal{
    opacity:0;
    transform:translateY(50px);
    transition:1s;
}

.reveal.active{
    opacity:1;
    transform:translateY(0);
}

.map{
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

footer{
    text-align:center;
    padding:20px;
    background:#111;
    color:white;
}

.dark{
    background:#111;
    color:white;
}

.dark footer{
    background:#000;
}

.dark nav{
    background:#000;
}
</style>
</head>
<body>

<nav>
    <h2>🌄 Phayao</h2>
    <button onclick="toggleDark()">🌙</button>
</nav>

<section class="hero">
    <h1>พะเยา</h1>
    <p>เมืองแห่งกว๊านและขุนเขา</p>
</section>

<div class="container">

    <div class="section reveal">
        <h2>กว๊านพะเยา</h2>
        <img src="c:\Users\cvzxc\Downloads\1753192165Sayhithailand01.jpg">
        <p>ทะเลสาบน้ำจืดขนาดใหญ่ เป็นจุดชมพระอาทิตย์ตกที่สวยงาม</p>
    </div>

    <div class="section reveal">
        <h2>วัดติโลกอาราม</h2>
        <img src="c:\Users\cvzxc\Downloads\วัดติโลกอาราม-Wat-Tiloaram.jpg">
        <p>วัดกลางน้ำในกว๊านพะเยา ต้องนั่งเรือเข้าไปชม</p>
    </div>

    <div class="section reveal">
        <h2>ภูหลงกา</h2>
        <img src="c:\Users\cvzxc\Downloads\123318553_3213122278816829_7073203756091888470_n.jpg">
        <p>จุดชมทะเลหมอกและวิวภูเขาที่สวยงาม</p>
    </div>

    <div class="section reveal">
        <h2>แผนที่พะเยา</h2>
        <div class="map">
            <iframe 
                src="https://www.google.com/maps?q=Phayao+Thailand&output=embed"
                width="100%" 
                height="400" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </div>

</div>

<footer>
    จัดทำโดย: เดชพีระพัฒน์ ศิรประภา ชนัญชิดา
</footer>

<script>
window.addEventListener("scroll", function(){
    const reveals = document.querySelectorAll(".reveal");
    for(let i=0;i<reveals.length;i++){
        let windowHeight = window.innerHeight;
        let elementTop = reveals[i].getBoundingClientRect().top;
        if(elementTop < windowHeight - 100){
            reveals[i].classList.add("active");
        }
    }
});

function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
